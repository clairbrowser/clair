kind: New
body: Back, forward, reload, the address and pinned extensions now sit in a toolbar above the page, as Arc's "Show as Toolbar" does, on by default. View › Hide Toolbar (Shift+Cmd+D), the toolbar's menu and a new "Location bar" choice on Settings › General move them back into the sidebar
