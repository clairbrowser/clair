<!doctype html>
<!-- A page that won't stop showing JavaScript dialogs, to check that its tab
     can still be closed. Click the button to start (the click is the user
     activation beforeunload needs). Query: ?confirm or ?prompt for that dialog
     instead of alert(); ?beforeunload adds a beforeunload handler that asks
     to stay, so closing goes through Chromium's beforeunload flow. -->
<title>dialog loop</title>
<style>
  body { margin: 0; background: #e8584f; font: 28px -apple-system; }
  button { margin: 120px 200px; font: inherit; padding: 12px 24px; }
</style>
<button id="start">Start the dialog loop</button>
<script>
  const query = location.search.slice(1).split("&");
  const kind = query.includes("confirm") ? "confirm"
             : query.includes("prompt") ? "prompt" : "alert";
  if (query.includes("beforeunload")) {
    addEventListener("beforeunload", (event) => {
      event.preventDefault();
      event.returnValue = "";
    });
  }
  document.getElementById("start").addEventListener("click", () => {
    let n = 0;
    while (true) window[kind](`${kind} ${++n}`);
  });
</script>
