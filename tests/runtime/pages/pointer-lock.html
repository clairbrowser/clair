<!doctype html>
<meta charset="utf-8">
<title>Clair pointer lock page</title>
<style>#stage { width: 320px; height: 180px; background: #246 }</style>
<div id="stage"></div>
<script>
  const stage = document.getElementById('stage');

  // Locks the pointer to the stage, hiding the cursor, and resolves with
  // 'locked' once it is.
  function lock() {
    return new Promise((resolve, reject) => {
      document.addEventListener('pointerlockchange',
          () => resolve(document.pointerLockElement === stage ? 'locked' : 'unlocked'), { once: true });
      document.addEventListener('pointerlockerror',
          () => reject(new Error('The pointer lock was refused')), { once: true });
      const request = stage.requestPointerLock();
      if (request && request.catch) request.catch(reject);
    });
  }

  function enter() {
    return stage.requestFullscreen().then(() => 'entered');
  }
</script>
